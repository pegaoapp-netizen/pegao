<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pega'o — Página no encontrada</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fff8f4;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #FF4D00, #FF7A00);
    color: #fff;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(255,77,0,.25);
  }
  header .brand { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  header .brand span { font-weight: 300; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    max-width: 560px;
    margin: 0 auto;
  }
  .heart { font-size: 64px; margin-bottom: 18px; }
  h1 { font-size: 26px; margin-bottom: 12px; color: #222; }
  p { font-size: 16px; line-height: 1.6; color: #666; margin-bottom: 14px; }
  .btn {
    display: inline-block;
    margin-top: 12px;
    background: linear-gradient(135deg, #FF4D00, #FF7A00);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    padding: 14px 34px;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(255,77,0,.35);
  }
  .btn:active { transform: scale(.97); }
  footer {
    text-align: center;
    padding: 18px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>
<header>
  <div class="brand">Pega'o <span>— Conecta en Miami</span></div>
</header>
<main>
  <div class="heart">🧡</div>
  <h1 id="title">Página no encontrada</h1>
  <p id="msg">La dirección que buscas no existe o cambió. Pero el amor sí está aquí cerca. 😄</p>
  <a class="btn" id="homeBtn" href="/">Volver al inicio</a>
</main>
<footer>© 2026 Pega'o · Hecho con 🧡 en Miami</footer>
<script>
  // GitHub Pages sirve este archivo para cualquier ruta inexistente
  // (ej: pegaousa.com/perfil/abc123) — adaptamos el mensaje.
  (function () {
    var path = window.location.pathname.toLowerCase();
    if (path.indexOf('/perfil/') !== -1 || path.indexOf('/profile/') !== -1) {
      document.getElementById('title').textContent = '🔗 Este perfil aún no está disponible';
      document.getElementById('msg').textContent =
        'Los perfiles compartidos de Pega\'o se abrirán directo en la app. El lanzamiento está cerca — vuelve pronto. 🧡';
    }
    // Enlace al inicio: funciona en pegaousa.com y en github.io/pegao/
    var home = window.location.origin + '/';
    if (window.location.hostname.indexOf('github.io') !== -1) {
      var parts = window.location.pathname.split('/');
      if (parts.length > 1 && parts[1]) home = window.location.origin + '/' + parts[1] + '/';
    }
    document.getElementById('homeBtn').href = home;
  })();
</script>
</body>
</html>
